<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- favicon-->
    <link rel="icon" href="img/favicon.ico" type="image/x-icon"/>
    <!-- fontawesome-->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.2.0/css/all.css"/>
    <!-- fancybox -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@4.0/dist/fancybox.css"/>
    <!-- swiper slider-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"/>
    <!-- animate css-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- custom styles-->
    <link rel="stylesheet" href="css/main.css"/>
    <title>Site | Templates</title>
  </head>
  <body>
    <div class="templates">
      <div class="container">
        <div class="templates__item">
              <button class="button templates__button">подробнее</button>
        </div>
        <div class="templates__item"><a class="phone templates__phone" href="tel:+7 (495) 123 45 67"><img src="img/icons/icon-phone.png" alt="phone"/><span></span></a>
        </div>
        <div class="templates__item">
              <div class="title">
                <p class="title__overtitle">о проекте</p>
                <div class="title__name">Клубный дом «Изобилие»</div>
              </div>
        </div>
        <div class="templates__item">
          <div class="reservation-form">
            <form class="form" action="/"> 
              <div class="reservation-form__title">Успей забронировать Аппартаменты по цене 2022 года</div>
              <div class="reservation-form__fields"> 
                <div class="reservation-form__field">
                  <input class="form__input" type="text" placeholder="Ваше имя"/>
                </div>
                <div class="reservation-form__field">
                  <input class="form__input js-phoneMask" type="text" placeholder="Телефон"/>
                </div>
                    <button class="button reservation-form__button">отправить заявку</button>
              </div>
            </form>
          </div>
        </div>
        <div class="templates__item"><a class="preview preview--sm preview--grid2" href="img/apartaments-0.webp" data-fancybox="gallery">
                <figure class="preview__img"><img src="img/apartaments-0.webp" alt="Презентабельный вид начиная с холла"/></figure>
                <div class="preview__name">Презентабельный вид начиная с холла</div></a>
        </div>
      </div>
    </div>
    <!-- ======================================== SCRIPTS-->
    <!-- jquery-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- fancybox -->
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@4.0/dist/fancybox.umd.js"></script>
    <!-- inputmask -->
    <script src="https://rawgit.com/RobinHerbots/Inputmask/5.x/dist/jquery.inputmask.js"></script>
    <!-- swiper slider-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <!-- scripts-->
    <script src="js/main.js"></script>
  </body>
</html>
